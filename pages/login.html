<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva Login</title>
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
    <main>
        <section class="image">
            <div class="titleImg">
                <img src="../img/logoSencillo-removebg.png" alt="Imagen de concierto">
                <p>Vibra</p>
            </div>
            <div class="subTitle">
                <h2>Tu puerta de entrada <span>a los mejores eventos</span></h2>
            </div>
            <div class="text">
                <p>Conecta con la música, la cultura y la diversión.</p>
            </div>
        </section>

        <section class="login">
            <form action="" class="formulario">
                <h2>Iniciar sesión</h2>
                <p>Ingresa tus datos para continuar</p>
                <input type="text" class="user" placeholder="Usuario">
                <input type="password" class="password" placeholder="Contraseña">
                <button type="button">Ingresar</button>
            </form>
        </section>
    </main>
</body>
</html>
